name: Release

on:
  # Build installers and publish a GitHub Release when a version tag is pushed.
  push:
    tags: ['v*']
  # Manual runs build artifacts only (no Release is published for non-tag refs).
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret configured; falling back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mediary.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/mediary.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APKs (split per ABI) and App Bundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Stage artifacts
        run: |
          mkdir -p release
          APK_DIR=build/app/outputs/flutter-apk
          cp "$APK_DIR/app-arm64-v8a-release.apk"   release/Mediary-android-arm64-v8a.apk
          cp "$APK_DIR/app-armeabi-v7a-release.apk" release/Mediary-android-armeabi-v7a.apk
          cp "$APK_DIR/app-x86_64-release.apk"      release/Mediary-android-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab release/Mediary-android.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS release
        run: flutter build macos --release

      - name: Stage artifacts
        run: |
          mkdir -p release
          ARCH="$(uname -m)"
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Mediary.app \
            "$GITHUB_WORKSPACE/release/Mediary-macos-$ARCH.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$src\*" -DestinationPath "release\Mediary-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  release:
    # Only publish a GitHub Release for version tags; manual runs stop at artifacts.
    if: github.ref_type == 'tag'
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
