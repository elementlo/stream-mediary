name: Board Check

# Manual cross-platform smoke check for the message board feature.
# Runs integration_test/board_check_test.dart against the live Waline server.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  check-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Run board check
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/board_check_test.dart
          -d windows
