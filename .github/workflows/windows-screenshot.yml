name: Windows Screenshot

# Manual workflow: builds the Windows app on a GitHub-hosted runner (once per
# theme, in screenshot demo mode), launches it, captures the home page window
# and commits both PNGs back to the repo. No local Windows machine needed.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  capture-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release (light)
        run: >
          flutter build windows --release
          --dart-define=SCREENSHOT_DEMO=true
          --dart-define=SCREENSHOT_THEME=light

      - name: Capture light screenshot
        shell: pwsh
        run: ./tool/windows_capture.ps1 -Theme light

      - name: Build Windows release (dark)
        run: >
          flutter build windows --release
          --dart-define=SCREENSHOT_DEMO=true
          --dart-define=SCREENSHOT_THEME=dark

      - name: Capture dark screenshot
        shell: pwsh
        run: ./tool/windows_capture.ps1 -Theme dark

      - name: Commit screenshots back to repo
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/windows-home-light.png docs/screenshots/windows-home-dark.png
          git add website/src/assets/screenshots/windows-home-light.png website/src/assets/screenshots/windows-home-dark.png
          if (git diff --cached --quiet) {
            Write-Host "No screenshot change to commit."
          } else {
            git commit -m "docs: update Windows home screenshots [skip ci]"
            git push
          }
