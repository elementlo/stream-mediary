name: stream_mediary
description: "Cross-platform M3U8 media downloader"
publish_to: 'none'

version: 0.0.9+9

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Routing
  go_router: ^16.0.0

  # Networking
  dio: ^5.7.0

  # Crypto (pure Dart AES-CBC)
  pointycastle: ^4.0.0

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0

  # Video playback (supports desktop + .ts)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Platform utilities
  path_provider: ^2.1.0
  path: ^1.9.0
  file_selector: ^1.0.0
  permission_handler: ^12.0.0
  window_manager: ^0.5.0
  open_filex: ^4.5.0
  disk_usage: ^1.0.0
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^6.1.5
  battery_plus: ^6.2.3
  share_plus: ^13.3.0

  # Models & utils
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.0
  collection: ^1.19.0
  logging: ^1.3.0
  uuid: ^4.5.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.7.0
  drift_dev: ^2.20.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0

  # Icon generation
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon_square.png"
  image_path: "assets/icon.png"
